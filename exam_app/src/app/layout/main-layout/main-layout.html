<div class="flex h-screen bg-[#F8F9FA]">
  <!-- Sidebar -->
  <aside class="w-64 bg-white flex flex-col border-r border-gray-100 shadow-sm shrink-0">
    <div class="p-8">
      <div class="flex items-center gap-3 mb-12">

        <div>
          <img src="assets/images/elevate_logo.png" alt="Elevate Logo" class="h-8 w-auto mb-1"
            style="filter: brightness(0.3);">
          <span class="text-[10px] uppercase font-bold text-gray-400 tracking-widest">Exam App</span>
        </div>
      </div>

      <nav class="space-y-2">
        <a *ngFor="let link of sidebarLinks" [routerLink]="link.route"
          routerLinkActive="bg-[#2563EB] text-white shadow-xl shadow-[#2563EB]/20 !text-white"
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all duration-300 text-gray-500 hover:bg-gray-50 hover:text-[#2563EB] group">
          <i [class]="link.icon" class="text-lg transition-transform duration-300 group-hover:scale-110"></i>
          <span class="font-semibold tracking-tight">{{ link.label }}</span>
        </a>
      </nav>
    </div>

    <div class="mt-auto p-8 border-t border-gray-50 bg-gray-50/30">
      <div class="flex items-center gap-3">
        <div class="relative group cursor-pointer">
          <img src="https://i.pravatar.cc/150?u=manar" alt="Profile"
            class="w-10 h-10 rounded-full border-2 border-white shadow-md transition-transform duration-300 group-hover:scale-105">
          <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-white rounded-full"></div>
        </div>
        <div class="flex-1 overflow-hidden">
          <h3 class="text-sm font-bold text-gray-800 truncate leading-none mb-1">{{userName}}</h3>
          <p class="text-[10px] font-medium text-gray-400 truncate tracking-tight">{{email}}</p>
        </div>
        <button class="text-gray-400 hover:text-[#2563EB] transition-all duration-300 hover:translate-x-1">
          <i class="pi pi-chevron-right text-xs"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <!-- Background subtle gradient -->
    <div class="absolute inset-0 bg-gradient-to-br from-[#2563EB]/5 to-transparent pointer-events-none"></div>

    <div class="flex-1 overflow-y-auto p-8 relative z-10">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
