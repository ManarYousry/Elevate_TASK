  <app-breadcrumb [items]="breadcrumbItems"></app-breadcrumb>
    <app-page-header title="Account Setting" icon="pi pi-user" [url]="'/dashboard'"></app-page-header>
<div class="flex h-[70vh] bg-[#F8F9FA]">
    
    <!-- Sidebar -->
    <aside class="w-64 bg-white flex flex-col border-r border-gray-100 shadow-sm shrink-0">
        <div class="p-8">
     

            <nav class="space-y-2">
                <a *ngFor="let link of sidebarLinks" [routerLink]="link.route"
                    routerLinkActive="bg-blue-100 text-blue-500 shadow-xl shadow-blue-100/20 !text-blue-500"
                    [routerLinkActiveOptions]="{exact: true}"
                    class="flex items-center gap-3 px-4 py-3  transition-all duration-300 text-gray-500 hover:bg-gray-50 hover:text-blue-500] group">
                    <i [class]="link.icon" class="text-lg transition-transform duration-300 group-hover:scale-110"></i>
                    <span class="font-semibold tracking-tight">{{ link.label }}</span>
                </a>
            </nav>
        </div>

        <div class="mt-auto p-8 border-t border-gray-50 bg-gray-50/30">
            <div class="items-center gap-3">
                <div class="relative group cursor-pointer ">

                    <div class=" bg-red-50  border-2 border-white p-3 rounded-xl cursor-pointer">

                        <h3 (click)="logout()"class=" font-bold text-red-600  leading-none mb-1"> <i
                                class="pi pi-sign-out me-3"></i> Logout</h3>

                    </div>
                </div>


            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col overflow-hidden relative">
        <!-- Background subtle gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-[#2563EB]/5 to-transparent pointer-events-none"></div>

        <div class="flex-1 overflow-y-auto px-3  relative z-10">
      
 <router-outlet></router-outlet>
           
           
        </div>
    </main>
</div>
